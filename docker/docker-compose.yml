version: '3.8'

services:
  # 1. PostgreSQL 16 Primary Relational Database
  postgres:
    image: postgres:16-alpine
    container_name: takshvaya-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-takshvaya_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-takshvaya_secure_pass_2026}
      POSTGRES_DB: ${DB_NAME:-takshvaya_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../backend/src/database/schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - takshvaya-internal
    # Note: Port is NOT exposed to public host to satisfy infrastructure isolation rule!
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U takshvaya_user -d takshvaya_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Redis 7 Cache & BullMQ Queue
  redis:
    image: redis:7-alpine
    container_name: takshvaya-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-takshvaya_redis_secure_pass}
    volumes:
      - redis_data:/data
    networks:
      - takshvaya-internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. ClamAV Malware Scanner for Resumes
  clamav:
    image: clamav/clamav:stable
    container_name: takshvaya-clamav
    restart: unless-stopped
    networks:
      - takshvaya-internal

  # 4. Takshvaya Backend API Service
  backend:
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: takshvaya-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      FRONTEND_URL: http://localhost:3000
      DATABASE_URL: postgresql://takshvaya_user:takshvaya_secure_pass_2026@postgres:5432/takshvaya_db
      REDIS_URL: redis://:takshvaya_redis_secure_pass@redis:6379
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@takshvaya.org}
      ADMIN_PHONE: "${ADMIN_PHONE:-9876543210}"
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-takshvaya-prod-access-token-key-must-be-min-64-chars-very-secure}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-takshvaya-prod-refresh-token-key-must-be-min-64-chars-very-secure}
      JWT_ADMIN_SECRET: ${JWT_ADMIN_SECRET:-takshvaya-prod-admin-token-key-must-be-min-64-chars-very-secure}
    ports:
      - "5000:5000"
    networks:
      - takshvaya-internal
      - takshvaya-edge

  # 5. Takshvaya Next.js Frontend Web App
  frontend:
    build:
      context: ../frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: takshvaya-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost:5000/api/v1
    ports:
      - "3000:3000"
    networks:
      - takshvaya-edge

volumes:
  postgres_data:
  redis_data:

networks:
  takshvaya-internal:
    internal: true # Isolated internal network: Database cannot be reached from outside!
  takshvaya-edge:
